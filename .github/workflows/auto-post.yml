name: Telegram AI Auto Poster

on:
  schedule:
    # Optimized for IST (India Standard Time) - 5-6 posts per day including Magazine
    # 6 posts per day (IST):
    #   8:10 AM  → Magazine
    #   11:00 AM → Python
    #   1:00 PM  → Interview Prep 🆕
    #   2:00 PM  → JavaScript
    #   6:00 PM  → ML Engineering
    #   9:00 PM  → Cyber Security
    # UTC equivalents: 2:40, 5:30, 7:30, 8:30, 12:30, 15:30
    - cron: "40 2 * * *"             # 8:10 AM IST (Magazine)
    - cron: "30 5,7,8,12,15 * * *"   # Python, Interview, JS, ML, Security
  workflow_dispatch:
    inputs:
      post_type_override:
        description: 'Force Post Type (magazine, python, etc)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot main
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TIMEZONE_OFFSET_HOURS: ${{ secrets.TIMEZONE_OFFSET_HOURS }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          POST_TYPE_OVERRIDE: ${{ inputs.post_type_override }}
        run: |
          python -m src.main
