name: Telegram AI Auto Poster

on:
  schedule:
    # Optimized High-Signal Cadence for IST (India Standard Time)
    # 3 prime-time daily drops with maximum developer engagement:
    #   03:30 UTC = 09:00 AM IST → Morning Drop (AI Engineering / Python / Sunday Magazine)
    #   08:00 UTC = 01:30 PM IST → Midday Drop (FAANG LeetCode Problem of the Day)
    #   13:30 UTC = 07:00 PM IST → Evening Drop (Modern Fullstack / Cyber Security)
    - cron: "30 3 * * *"      # 9:00 AM IST
    - cron: "0 8 * * *"       # 1:30 PM IST
    - cron: "30 13 * * *"     # 7:00 PM IST
  workflow_dispatch:
    inputs:
      post_type_override:
        description: 'Force Post Type (ai, python, leetcode, fullstack, security, magazine)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot main
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TIMEZONE_OFFSET_HOURS: ${{ secrets.TIMEZONE_OFFSET_HOURS }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          POST_TYPE_OVERRIDE: ${{ inputs.post_type_override }}
        run: |
          python -m src.main
